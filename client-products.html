<div class="header">
  <img src="images/Noshi.webp" alt="نوشي بيكري" />
  <h2 style="color:#d35400;">📋 منتجات الزبائن</h2>
</div>

<nav class="nav" aria-label="التنقل">

  <div class="nav-row">

    <button class="nav-btn" onclick="window.location.href='index.html'">
      🛍️ المنتجات
    </button>

    <a href="dashboard.html" class="nav-btn">
      🌐 طلبات الموقع
    </a>

    <button class="nav-btn" onclick="window.location.href='order.html'">
      📦 الطلبيات
    </button>

  </div>

  <div class="nav-row">

    <button class="nav-btn" onclick="window.location.href='client.html'">
      👥 العملاء
    </button>

    <button class="nav-btn" onclick="window.location.href='mandoubs.html'">
      🚚 المناديب
    </button>

    <button class="nav-btn" onclick="window.location.href='sales.html'">
      📊 الاحصائيات
    </button>

    <button class="nav-btn" onclick="window.location.href='expenses.html'">
      💳 المصروفات
    </button>

    <button class="nav-btn" onclick="window.location.href='client-products.html'">
      ⏰ تسليم الطلبات
    </button>

  </div>

</nav>

<!-- إحصائيات -->

<div class="stats-container" id="statsContainer">
  <div class="stat-card">
    <div class="number" id="totalClients">0</div>
    <div class="label">👥 إجمالي الزبائن</div>
  </div>
  <div class="stat-card">
    <div class="number" id="totalProducts">0</div>
    <div class="label">🍰 إجمالي المنتجات</div>
  </div>
  <div class="stat-card">
    <div class="number" id="checkedProducts">0</div>
    <div class="label">✅ تم تجهيزها</div>
  </div>
  <div class="stat-card">
    <div class="number" id="completionRate">0%</div>
    <div class="label">📊 نسبة الإنجاز</div>
  </div>
</div>

<!-- معلومات انتهاء الصلاحية -->

<div class="expiry-info" id="expiryInfo"></div>

<!-- أكثر المنتجات طلباً -->

<div class="top-products" id="topProductsContainer">
  <strong>🏆 أكثر المنتجات طلباً</strong>
  <div id="topProductsList"></div>
</div>

<!-- بحث -->

<input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن زبون أو منتج...">

<!-- فلاتر -->

<div class="filter-buttons">
  <button class="filter-btn active" data-filter="all">الكل</button>
  <button class="filter-btn" data-filter="today">طلبات اليوم 📅</button>
  <button class="filter-btn" data-filter="tomorrow">طلبات بكرة ⏰</button>
  <button class="filter-btn" data-filter="completed">المكتملة ✅</button>
  <button class="filter-btn" data-filter="pending">غير المكتملة ⏳</button>
</div>

<!-- قائمة الزبائن -->

<div id="clientsContainer"></div>

<script src="ui-modal.js"></script>
<script src="./db.js"></script>




<script src="config.js"></script><script src="auth.js"></script>

  <!-- Page-specific logic: edit js/client-products.js only. Loaded after shared dependencies and page DOM. -->
  <script src="js/client-products.js"></script>
</body>
</html>
