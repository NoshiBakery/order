<script>
  const STORAGE_KEY = "order_products_checkboxes_final";

  let activeProductFilter = null;
  let salesData = {};
  let checkboxStateData = {};
  let storageReady = false;

  function isPlainObject(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }

  function showStorageMessage(message, type = "error") {
    const oldMessage = document.getElementById("storageStatusMessage");
    if (oldMessage) oldMessage.remove();

    const messageBox = document.createElement("div");
    messageBox.id = "storageStatusMessage";
    messageBox.textContent = message;
    messageBox.style.cssText = `
      position:fixed;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      z-index:100000;
      width:min(92%,460px);
      padding:11px 14px;
      border-radius:10px;
      text-align:center;
      color:#fff;
      font-family:'Cairo',sans-serif;
      font-size:0.88rem;
      font-weight:700;
      line-height:1.7;
      box-shadow:0 5px 18px rgba(0,0,0,.22);
      background:${type === "success" ? "#27ae60" : "#c0392b"};
    `;

    document.body.appendChild(messageBox);

    setTimeout(() => {
      if (messageBox.isConnected) messageBox.remove();
    }, 4000);
  }

  async function initStorageData() {
    if (!window.NoshiDB) {
      throw new Error("ملف db.js غير مربوط أو لم يتم تحميله");
    }

    const [savedSalesData, savedCheckboxData] = await Promise.all([
      NoshiDB.get("salesData", {}),
      NoshiDB.get(STORAGE_KEY, {})
    ]);

    salesData = isPlainObject(savedSalesData)
      ? savedSalesData
      : {};

    checkboxStateData = isPlainObject(savedCheckboxData)
      ? savedCheckboxData
      : {};

    await cleanExpiredCheckboxStates();
    storageReady = true;
  }

  async function cleanExpiredCheckboxStates() {
    const now = Date.now();
    const cleanedData = {};
    let changed = false;

    Object.entries(checkboxStateData).forEach(([id, info]) => {
      const validInfo =
        isPlainObject(info) &&
        Number(info.expiry) > now;

      if (validInfo) {
        cleanedData[id] = {
          checked: info.checked === true,
          expiry: Number(info.expiry)
        };
      } else {
        changed = true;
      }
    });

    if (!changed) return;

    await NoshiDB.set(STORAGE_KEY, cleanedData);
    checkboxStateData = cleanedData;
  }

  function getAllCheckboxStates() {
    const states = {};
    const now = Date.now();

    Object.entries(checkboxStateData).forEach(([id, info]) => {
      if (
        isPlainObject(info) &&
        Number(info.expiry) > now &&
        info.checked === true
      ) {
        states[id] = true;
      }
    });

    return states;
  }

  async function saveCheckboxState(productId, checked, deliveryDate) {
    const nextData = {
      ...checkboxStateData
    };

    if (checked) {
      nextData[productId] = {
        checked: true,
        expiry: getExpiryFromDeliveryDate(deliveryDate)
      };
    } else {
      delete nextData[productId];
    }

    /*
      لا نغيّر بيانات الذاكرة إلا بعد نجاح الحفظ في IndexedDB.
    */
    await NoshiDB.set(STORAGE_KEY, nextData);
    checkboxStateData = nextData;
  }

  function convertTo12HourFormat(time24) {
    if (!time24 || time24 === "12:00") return "12:00 م";

    const [hours, minutes] = time24.split(":");
    let hour = parseInt(hours, 10);
    const ampm = hour >= 12 ? "م" : "ص";

    hour = hour % 12;
    if (hour === 0) hour = 12;

    return `${hour.toString().padStart(2, "0")}:${minutes} ${ampm}`;
  }

  function getExpiryFromDeliveryDate(deliveryDate) {
    if (!deliveryDate) {
      return Date.now() + 24 * 60 * 60 * 1000;
    }

    const datePart = String(deliveryDate).split(/[ T]/)[0];
    const expiryDate = new Date(`${datePart}T23:59:59`);

    return expiryDate.getTime();
  }

  function stableTextHash(value) {
    const text = String(value ?? "");
    let h1 = 0xdeadbeef ^ text.length;
    let h2 = 0x41c6ce57 ^ text.length;

    for (let i = 0; i < text.length; i++) {
      const charCode = text.charCodeAt(i);
      h1 = Math.imul(h1 ^ charCode, 2654435761);
      h2 = Math.imul(h2 ^ charCode, 1597334677);
    }

    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^
      Math.imul(h2 ^ (h2 >>> 13), 3266489909);

    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^
      Math.imul(h1 ^ (h1 >>> 13), 3266489909);

    const high = h2 >>> 0;
    const low = h1 >>> 0;

    return `${high.toString(36)}${low.toString(36)}`;
  }

  function getProductId(orderId, productName, clientName, itemIndex) {
    const rawKey = [
      orderId,
      clientName,
      productName,
      Number(itemIndex)
    ].join("\u001f");

    return `product_${stableTextHash(rawKey)}_${Number(itemIndex)}`;
  }

  function getTrackableItems(order) {
    const items = Array.isArray(order && order.items)
      ? order.items
      : [];

    return items
      .map((item, itemIndex) => ({ item, itemIndex }))
      .filter(({ item }) => item && item.name !== "مندوب");
  }

  function getTodayAndTomorrowOrders() {
    // الاسم التاريخي للدالة محفوظ للتوافق، لكنها الآن ترجع اليوم وكل الطلبات المستقبلية.
    const startOfToday = new Date();
    startOfToday.setHours(0, 0, 0, 0);
    const orders = [];

    Object.keys(salesData).forEach(monthKey => {
      const monthOrders = Array.isArray(salesData[monthKey])
        ? salesData[monthKey]
        : [];

      monthOrders.forEach((order, idx) => {
        const deliveryDate = order && order.deliveryDate;
        if (!deliveryDate) return;

        const normalized = String(deliveryDate).replace(" ", "T");
        const dt = new Date(normalized);
        if (Number.isNaN(dt.getTime())) return;
        if (dt.getTime() < startOfToday.getTime()) return;

        const orderDateStr = String(deliveryDate).split(/[ T]/)[0];

        orders.push({
          ...order,
          originalMonthKey: monthKey,
          originalIndex: idx,
          orderId: `${monthKey}_${idx}`,
          deliveryDateOnly: orderDateStr,
          _deliveryTimestamp: dt.getTime()
        });
      });
    });

    // اليوم أولًا، وداخل اليوم أقرب وقت أولًا، ثم الغد وما بعده تصاعديًا.
    return orders.sort((a, b) =>
      (a._deliveryTimestamp || 0) - (b._deliveryTimestamp || 0)
    );
  }

  function getDayType(deliveryDate) {
    if (!deliveryDate) return "unknown";

    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
    const orderDateStr = String(deliveryDate).split(/[ T]/)[0];

    if (orderDateStr === todayStr) return "today";

    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);

    const tomorrowStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, "0")}-${String(tomorrow.getDate()).padStart(2, "0")}`;

    if (orderDateStr === tomorrowStr) return "tomorrow";
    return "other";
  }

  function calculateStats(orders, checkboxStates) {
    let totalProducts = 0;
    let checkedProducts = 0;
    const productCount = {};

    orders.forEach(order => {
      getTrackableItems(order).forEach(({ item, itemIndex }) => {
        totalProducts++;

        const productId = getProductId(
          order.orderId,
          item.name,
          order.client,
          itemIndex
        );

        if (checkboxStates[productId] === true) {
          checkedProducts++;
        }

        productCount[item.name] =
          (productCount[item.name] || 0) + 1;
      });
    });

    const sortedProducts = Object.entries(productCount)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10);

    return {
      totalClients: orders.length,
      totalProducts,
      checkedProducts,
      completionRate:
        totalProducts > 0
          ? Math.round((checkedProducts / totalProducts) * 100)
          : 0,
      topProducts: sortedProducts
    };
  }

  // ============================================================
  // عرض الإحصائيات — بدون لمس topProductsList هنا
  // ============================================================
  function displayStats(stats, orders) {
    document.getElementById("totalClients").textContent = stats.totalClients;
    document.getElementById("totalProducts").textContent = stats.totalProducts;
    document.getElementById("checkedProducts").textContent = stats.checkedProducts;
    document.getElementById("completionRate").textContent = stats.completionRate + "%";

    const topList = document.getElementById("topProductsList");

    if (stats.topProducts.length === 0) {
      topList.innerHTML = '<span style="color:#999;">لا توجد منتجات</span>';
    } else {
      topList.innerHTML = stats.topProducts.map(([name, count]) =>
        `<span class="top-product-item"
               data-product-name="${name.replace(/"/g, "&quot;")}"
               onclick="filterByProduct(this)">
          ${name} (${count})
        </span>`
      ).join("");
    }

    applyProductFilterStyle();

    if (orders.length > 0) {
      const expiryMap = new Map();

      orders.forEach(order => {
        if (!order.deliveryDate) return;

        const datePart = String(order.deliveryDate).split(/[ T]/)[0];

        if (!expiryMap.has(datePart)) {
          expiryMap.set(datePart, new Date(`${datePart}T23:59:59`));
        }
      });

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);

      const tomorrowStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, "0")}-${String(tomorrow.getDate()).padStart(2, "0")}`;

      const sortedDates = Array.from(expiryMap.keys())
        .sort((a, b) => new Date(a) - new Date(b));

      let expiryText = "";

      for (const date of sortedDates) {
        const expiryDate = expiryMap.get(date);
        const remaining = expiryDate.getTime() - Date.now();

        const dayName =
          date === todayStr
            ? "📍 اليوم"
            : date === tomorrowStr
              ? "⏰ بكرة"
              : `📅 ${date}`;

        if (remaining > 0) {
          const hoursLeft = Math.floor(remaining / (1000 * 60 * 60));
          const minutesLeft = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
          expiryText += `${dayName} → ينتهي بعد ${hoursLeft} ساعة و ${minutesLeft} دقيقة<br>`;
        } else {
          expiryText += `${dayName} → انتهى ⏰<br>`;
        }
      }

      document.getElementById("expiryInfo").innerHTML =
        `⏰ <strong>الوقت المتبقي:</strong><br>${expiryText}`;
    } else {
      document.getElementById("expiryInfo").innerHTML = "📭 لا توجد طلبات";
    }
  }

  // ============================================================
  // دالة مستقلة لتطبيق ألوان الفلتر على العناصر الموجودة
  // ============================================================
  function applyProductFilterStyle() {
    document.querySelectorAll(".top-product-item").forEach(el => {
      const name = el.getAttribute("data-product-name");
      const isActive =
        activeProductFilter !== null &&
        name === activeProductFilter;

      el.style.background = isActive ? "#e67e22" : "white";
      el.style.color = isActive ? "white" : "#333";
      el.style.boxShadow = isActive
        ? "0 2px 5px rgba(0,0,0,0.2)"
        : "0 1px 2px rgba(0,0,0,0.1)";

      el.onmouseenter = () => {
        el.style.background = "#e67e22";
        el.style.color = "white";
      };

      el.onmouseleave = () => {
        const stillActive =
          activeProductFilter !== null &&
          el.getAttribute("data-product-name") === activeProductFilter;

        el.style.background = stillActive ? "#e67e22" : "white";
        el.style.color = stillActive ? "white" : "#333";
      };
    });
  }

  function displayClients(
    orders,
    checkboxStates,
    searchTerm = "",
    filter = "all",
    productFilter = null
  ) {
    const container = document.getElementById("clientsContainer");
    container.innerHTML = "";

    let filteredOrders = [...orders];

    if (productFilter) {
      filteredOrders = filteredOrders.filter(order =>
        (order.items || []).some(item => item.name === productFilter)
      );
    }

    if (searchTerm) {
      const term = searchTerm.toLowerCase();

      filteredOrders = filteredOrders.filter(order =>
        (order.client || "").toLowerCase().includes(term) ||
        (order.items || []).some(item =>
          String(item.name || "").toLowerCase().includes(term)
        )
      );
    }

    if (filter === "today") {
      filteredOrders = filteredOrders.filter(order =>
        getDayType(order.deliveryDate) === "today"
      );
    } else if (filter === "tomorrow") {
      filteredOrders = filteredOrders.filter(order =>
        getDayType(order.deliveryDate) === "tomorrow"
      );
    } else if (filter === "completed") {
      filteredOrders = filteredOrders.filter(order => {
        const items = getTrackableItems(order);

        return (
          items.length > 0 &&
          items.every(({ item, itemIndex }) =>
            checkboxStates[
              getProductId(
                order.orderId,
                item.name,
                order.client,
                itemIndex
              )
            ] === true
          )
        );
      });
    } else if (filter === "pending") {
      filteredOrders = filteredOrders.filter(order => {
        const items = getTrackableItems(order);

        return (
          items.length > 0 &&
          items.some(({ item, itemIndex }) =>
            checkboxStates[
              getProductId(
                order.orderId,
                item.name,
                order.client,
                itemIndex
              )
            ] !== true
          )
        );
      });
    }

    if (filteredOrders.length === 0) {
      container.innerHTML =
        '<div style="text-align:center; padding:40px; color:#999;">📭 لا توجد نتائج</div>';
      return;
    }

    let lastRenderedDate = null;
    filteredOrders.forEach(order => {
      const orderDate = String(order.deliveryDate || "").split(/[ T]/)[0];
      const dayKind = getDayType(order.deliveryDate);
      if (orderDate && orderDate !== lastRenderedDate && dayKind === "tomorrow") {
        const sep = document.createElement("div");
        sep.className = "day-separator";
        sep.textContent = "طلبات بكرا تبدأ من هنا";
        container.appendChild(sep);
      } else if (orderDate && orderDate !== lastRenderedDate && dayKind === "other") {
        const sep = document.createElement("div");
        sep.className = "day-separator";
        sep.textContent = `طلبات ${orderDate}`;
        container.appendChild(sep);
      }
      lastRenderedDate = orderDate || lastRenderedDate;

      const clientDiv = document.createElement("div");
      clientDiv.className = "client-card";

      const originalTime = order.deliveryDate
        ? String(order.deliveryDate).split(/[ T]/)[1] || "12:00"
        : "12:00";

      const deliveryTimeFormatted =
        convertTo12HourFormat(originalTime);

      const dayType = getDayType(order.deliveryDate);
      clientDiv.classList.add(dayType === "tomorrow" ? "tomorrow-order" : (dayType === "today" ? "today-order" : "future-order"));

      const dayTypeText =
        dayType === "today"
          ? "📍 اليوم"
          : dayType === "tomorrow"
            ? "⏰ بكرة"
            : `📅 ${String(order.deliveryDate || "").split(/[ T]/)[0]}`;

      const dayTypeClass =
        dayType === "today" ? "today" : "tomorrow";

      const items = getTrackableItems(order);

      let completedCount = 0;

      items.forEach(({ item, itemIndex }) => {
        const productId = getProductId(
          order.orderId,
          item.name,
          order.client,
          itemIndex
        );

        if (checkboxStates[productId] === true) {
          completedCount++;
        }
      });

      const pendingCount = items.length - completedCount;

      clientDiv.innerHTML = `
        <div class="client-header" onclick="toggleClient(this)">
          <div>
            <span class="client-name">👤 ${order.client || "بدون اسم"}</span>
            <div class="client-time">
              🕒 التسليم: ${deliveryTimeFormatted}
              <span class="delivery-tag ${dayTypeClass}">${dayTypeText}</span>
            </div>
          </div>
          <div>
            <span class="badge" style="background:${pendingCount === 0 ? "#27ae60" : "#e67e22"}">
              ${completedCount}/${items.length} مكتمل
            </span>
          </div>
        </div>
        <div class="client-products open">
          ${items.map(({ item, itemIndex }) => {
            const productId = getProductId(
              order.orderId,
              item.name,
              order.client,
              itemIndex
            );

            const isChecked =
              checkboxStates[productId] === true;

            const itemTotal =
              Number(item.price || 0) * Number(item.qty || 0);

            const discountText =
              Number(item.discount || 0) > 0
                ? ` (خصم ${item.discount}%)`
                : "";

            return `
              <div class="product-item">
                <div class="product-info">
                  <div class="product-name">${item.name} × ${item.qty}</div>
                  <div class="product-details">
                    ${item.price} ريال × ${item.qty} = ${itemTotal} ريال${discountText}
                    ${item.notes ? `<br>📝 ملاحظة: ${item.notes}` : ""}
                  </div>
                </div>
                <div class="product-check">
                  <input type="checkbox"
                         id="${productId}"
                         data-delivery-date="${order.deliveryDate}"
                         ${isChecked ? "checked" : ""}
                         onchange="toggleProduct('${productId}', this.checked, '${order.deliveryDate}')">
                  <label for="${productId}">تم</label>
                </div>
              </div>
            `;
          }).join("")}
          ${items.length === 0
            ? '<div style="padding:10px; color:#999;">لا توجد منتجات (مندوب فقط)</div>'
            : ""}
        </div>
      `;

      container.appendChild(clientDiv);
    });
  }

  // ============================================================
  // filterByProduct — فقط تعديل المتغير ثم refreshDisplay
  // ============================================================
  function filterByProduct(element) {
    const productName = element.getAttribute("data-product-name");

    activeProductFilter =
      activeProductFilter === productName
        ? null
        : productName;

    refreshDisplay();
  }

  function toggleClient(headerElement) {
    const productsDiv = headerElement.nextElementSibling;
    productsDiv.classList.toggle("open");
  }

  async function toggleProduct(productId, checked, deliveryDate) {
    if (!storageReady) {
      const input = document.getElementById(productId);
      if (input) input.checked = !checked;
      showStorageMessage("قاعدة البيانات لم تجهز بعد");
      return;
    }

    const input = document.getElementById(productId);
    if (input) input.disabled = true;

    try {
      await saveCheckboxState(productId, checked, deliveryDate);
      refreshDisplay();
    } catch (error) {
      console.error("فشل حفظ حالة تجهيز المنتج:", error);

      if (input) {
        input.checked = !checked;
        input.disabled = false;
      }

      showStorageMessage(
        "تعذر حفظ حالة المنتج. لم يتم تغيير البيانات."
      );
    }
  }

  function refreshDisplay() {
    if (!storageReady) return;

    const orders = getTodayAndTomorrowOrders();
    const checkboxStates = getAllCheckboxStates();
    const searchInput = document.getElementById("searchInput");
    const searchTerm = searchInput ? searchInput.value : "";

    const activeFilter =
      document.querySelector(".filter-btn.active")?.dataset.filter || "all";

    const stats = calculateStats(orders, checkboxStates);

    displayStats(stats, orders);
    displayClients(
      orders,
      checkboxStates,
      searchTerm,
      activeFilter,
      activeProductFilter
    );
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const container = document.getElementById("clientsContainer");
    const searchInput = document.getElementById("searchInput");

    if (container) {
      container.innerHTML =
        '<div style="text-align:center; padding:40px; color:#777;">⏳ جاري تحميل البيانات...</div>';
    }

    if (searchInput) {
      searchInput.disabled = true;
    }

    try {
      await initStorageData();
      refreshDisplay();

      if (searchInput) {
        searchInput.disabled = false;
        searchInput.addEventListener("input", refreshDisplay);
      }

      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter-btn").forEach(otherBtn => {
            otherBtn.classList.remove("active");
          });

          btn.classList.add("active");
          refreshDisplay();
        });
      });
    } catch (error) {
      console.error("فشل تحميل بيانات IndexedDB:", error);

      if (container) {
        container.innerHTML = `
          <div style="
            text-align:center;
            padding:24px;
            margin-top:15px;
            background:#fff;
            border:1px solid #f2b8b5;
            border-radius:12px;
            color:#c0392b;
            line-height:1.8;
          ">
            ❌ تعذر تحميل بيانات الصفحة من IndexedDB.<br>
            تأكد من وجود ملف db.js بجانب الصفحة ثم أعد المحاولة.
          </div>
        `;
      }

      showStorageMessage(
        "تعذر فتح قاعدة البيانات. لم يتم استخدام LocalStorage كبديل."
      );
    }
  });

  window.toggleClient = toggleClient;
  window.toggleProduct = toggleProduct;
  window.filterByProduct = filterByProduct;
</script>
