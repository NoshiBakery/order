<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>نقل بيانات نوشي للسحابة</title>
  <!-- NOSHI: styles for this exact position live in css/migration.css. -->
<link rel="stylesheet" href="css/migration.css">
</head>
<body>
<!-- NOSHI PAGE MAP: migration.html
     CSS: css/migration.css
     JS: js/migration.js
     Shared files remain shared. Do not change data keys during UI maintenance.
-->
  <div id="noshi-auth-cloak"></div>
  <div class="wrap">
    <div class="card">
      <h1>☁️ نقل بيانات نوشي للسحابة</h1>
      <p class="sub">هذه الصفحة للاستيراد الأول فقط. لن تستبدل أي بيانات سحابية موجودة مسبقًا.</p>

      <div id="cloudStatus" class="status">جاري فحص قاعدة البيانات السحابية…</div>

      <label class="file">
        <strong>اختر آخر نسخة all_data.json</strong><br><br>
        <input id="fileInput" type="file" accept="application/json,.json" />
      </label>

      <div id="summary" class="summary hidden">
        <div class="box"><span class="label">العميلات</span><b id="clientsCount">0</b></div>
        <div class="box"><span class="label">أشهر المبيعات</span><b id="salesMonths">0</b></div>
        <div class="box"><span class="label">طلبات المبيعات</span><b id="salesOrders">0</b></div>
        <div class="box"><span class="label">المصروفات</span><b id="expensesCount">0</b></div>
      </div>

      <div id="progressWrap" class="hidden">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="progressText" class="small">جاهز</div>
      </div>

      <button id="importBtn" class="primary" disabled>نقل البيانات للسحابة</button>
      <button id="optimizeBtn" class="secondary" type="button">⚡ تقسيم المبيعات شهريًا للسرعة</button>
      <button id="backBtn" class="secondary" type="button">رجوع للنظام</button>
      <p class="small">احتفظ بملف النسخة الاحتياطية عندك حتى ننتهي من التحقق النهائي.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <!-- NOSHI: original inline script #1; same execution position, now external. -->
<script src="js/migration.js"></script>
</body>
</html>
