<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>نقل بيانات نوشي للسحابة</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f3ee;color:#292522}
    #noshi-auth-cloak{position:fixed;inset:0;background:#f7f3ee;z-index:99999}
    body{padding:max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
    .wrap{width:min(100%,620px);margin:0 auto}.card{background:#fff;border:1px solid #eadfd6;border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(70,48,36,.10)}
    h1{font-size:24px;margin:0 0 7px}.sub{color:#766b64;line-height:1.7;margin:0 0 18px}.status{border-radius:15px;padding:13px 14px;margin:12px 0;font-weight:700;line-height:1.7;background:#f4f1ed}.status.ok{background:#eaf7ee;color:#17622d}.status.err{background:#fff0ef;color:#9d2620}.status.warn{background:#fff7e6;color:#7f5a00}
    .file{display:block;border:2px dashed #d7c7bb;border-radius:16px;padding:18px;text-align:center;background:#fcfaf8;margin:14px 0}.file input{width:100%;font-size:16px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.box{background:#faf7f4;border-radius:14px;padding:12px}.box b{display:block;font-size:20px;margin-top:4px}.label{font-size:13px;color:#796d66}
    button{appearance:none;border:0;border-radius:15px;width:100%;min-height:52px;padding:12px 16px;font-size:17px;font-weight:800;cursor:pointer}.primary{background:#2f7d4a;color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eee7e1;color:#4f433c;margin-top:10px}.progress{height:9px;background:#eee7e1;border-radius:999px;overflow:hidden;margin:14px 0 4px}.bar{height:100%;width:0;background:#2f7d4a;transition:width .2s}.small{font-size:13px;color:#7c7169;line-height:1.7}.hidden{display:none!important}
  </style>
</head>
<body>
  <div id="noshi-auth-cloak"></div>
  <div class="wrap">
    <div class="card">
      <h1>☁️ نقل بيانات نوشي للسحابة</h1>
      <p class="sub">هذه الصفحة للاستيراد الأول فقط. لن تستبدل أي بيانات سحابية موجودة مسبقًا.</p>

      <div id="cloudStatus" class="status">جاري فحص قاعدة البيانات السحابية…</div>

      <label class="file">
        <strong>اختر آخر نسخة all_data.json</strong><br><br>
        <input id="fileInput" type="file" accept="application/json,.json" />
      </label>

      <div id="summary" class="summary hidden">
        <div class="box"><span class="label">العميلات</span><b id="clientsCount">0</b></div>
        <div class="box"><span class="label">أشهر المبيعات</span><b id="salesMonths">0</b></div>
        <div class="box"><span class="label">طلبات المبيعات</span><b id="salesOrders">0</b></div>
        <div class="box"><span class="label">المصروفات</span><b id="expensesCount">0</b></div>
      </div>

      <div id="progressWrap" class="hidden">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="progressText" class="small">جاهز</div>
      </div>

      <button id="importBtn" class="primary" disabled>نقل البيانات للسحابة</button>
      <button id="backBtn" class="secondary" type="button">رجوع للنظام</button>
      <p class="small">احتفظ بملف النسخة الاحتياطية عندك حتى ننتهي من التحقق النهائي.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
  (function(){
    "use strict";
    const fileInput=document.getElementById("fileInput");
    const importBtn=document.getElementById("importBtn");
    const cloudStatus=document.getElementById("cloudStatus");
    const summary=document.getElementById("summary");
    const progressWrap=document.getElementById("progressWrap");
    const bar=document.getElementById("bar");
    const progressText=document.getElementById("progressText");
    let parsed=null;
    let cloudEmpty=false;

    function setStatus(text,type){cloudStatus.className="status"+(type?" "+type:"");cloudStatus.textContent=text}
    function countOrders(salesData){return Object.values(salesData||{}).reduce((n,v)=>n+(Array.isArray(v)?v.length:0),0)}
    function countExpenses(expensesData){return Object.values(expensesData||{}).reduce((n,v)=>n+(Array.isArray(v)?v.length:0),0)}
    function updateButton(){importBtn.disabled=!(parsed&&cloudEmpty)}

    async function checkCloud(){
      try{
        const s=await NoshiDB.status();
        cloudEmpty=Number(s.count||0)===0;
        if(cloudEmpty) setStatus("✅ القاعدة السحابية فارغة وجاهزة للاستيراد الأول.","ok");
        else setStatus(`⚠️ يوجد ${s.count} مفاتيح بيانات في السحابة. الاستيراد الأول مقفول لحماية البيانات الموجودة.`,"warn");
      }catch(e){cloudEmpty=false;setStatus("تعذر فحص السحابة: "+(e.message||e),"err")}
      updateButton();
    }

    fileInput.addEventListener("change",async()=>{
      parsed=null;summary.classList.add("hidden");updateButton();
      const file=fileInput.files&&fileInput.files[0];if(!file)return;
      try{
        parsed=JSON.parse(await file.text());
        if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))throw new Error("ملف JSON غير صحيح");
        document.getElementById("clientsCount").textContent=Array.isArray(parsed.clients)?parsed.clients.length:0;
        document.getElementById("salesMonths").textContent=parsed.salesData&&typeof parsed.salesData==="object"?Object.keys(parsed.salesData).length:0;
        document.getElementById("salesOrders").textContent=countOrders(parsed.salesData);
        document.getElementById("expensesCount").textContent=countExpenses(parsed.expensesData);
        summary.classList.remove("hidden");
      }catch(e){parsed=null;setStatus("ملف النسخة غير صالح: "+(e.message||e),"err")}
      updateButton();
    });

    importBtn.addEventListener("click",async()=>{
      if(!parsed||!cloudEmpty)return;
      importBtn.disabled=true;fileInput.disabled=true;progressWrap.classList.remove("hidden");bar.style.width="8%";progressText.textContent="جاري رفع البيانات… لا تغلق الصفحة.";
      try{
        const result=await NoshiDB.importAll(parsed,{initialOnly:true});
        bar.style.width="90%";progressText.textContent="جاري التحقق من البيانات السحابية…";
        const s=await NoshiDB.status();
        if(Number(s.count||0)!==Number(result.importedCount||0))throw new Error("عدد المفاتيح بعد النقل لا يطابق الملف");
        bar.style.width="100%";
        progressText.textContent=`تم نقل ${result.importedCount} مفاتيح بيانات بنجاح.`;
        setStatus("✅ اكتمل النقل للسحابة. الآن جهازك وجهاز الوالدة سيقرآن نفس بيانات النظام.","ok");
        cloudEmpty=false;
      }catch(e){
        setStatus("فشل النقل: "+(e.message||e),"err");
        progressText.textContent="لم يكتمل النقل. لم يتم تشغيل استبدال تلقائي للبيانات.";
        fileInput.disabled=false;
        await checkCloud();
      }
    });

    document.getElementById("backBtn").addEventListener("click",()=>location.href="index.html");

    (async()=>{
      try{await NoshiAuth.guard();await checkCloud()}
      catch(e){if(e.status!==401)setStatus("تعذر التحقق من تسجيل الدخول.","err")}
    })();
  })();
  </script>
</body>
</html>
