  <title>ملف العميل - نوشي بيكري</title>

  <!-- NOSHI: styles for this exact position live in css/client-history.css. -->
<link rel="stylesheet" href="css/client-history.css?v=4.9.0">
  <style id="noshi-auth-cloak">
body{visibility:hidden!important}
html{background:#f6f1ec!important;min-height:100%;color-scheme:light}
html::before{content:"🔐  جاري التحقق من الجلسة…\A\Aانتظر لحظات";white-space:pre-line;visibility:visible!important;position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#f6f1ec;color:#3b302c;font:800 16px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
html[data-auth-state="slow"]::before{content:"⏳  التحقق أخذ وقتًا أطول من المعتاد…\A\Aلا تغلق التطبيق، نحاول إكمال الاتصال"}
html[data-auth-state="error"]::before{content:"⚠️  تعذر التحقق من الجلسة\A\Aاضغط على الشاشة لإعادة المحاولة";background:#fff5f2;color:#7a2e24}
html[data-theme="dark"]{background:#0b1016!important}
html[data-theme="dark"]::before{background:#0b1016;color:#f4f7fb}
html[data-theme="dark"][data-auth-state="error"]::before{background:#160f12;color:#ffb7b2}
</style>
<script>
(function(){
  window.__noshiAuthSlowTimer=setTimeout(function(){
    if(document.getElementById('noshi-auth-cloak')) document.documentElement.dataset.authState='slow';
  },6000);
  window.__noshiAuthFailTimer=setTimeout(function(){
    if(!document.getElementById('noshi-auth-cloak')) return;
    document.documentElement.dataset.authState='error';
    document.documentElement.addEventListener('click',function(){ location.reload(); },{once:true});
  },18000);
})();
</script>
<!-- NOSHI DARK THEME: all night-mode visual rules live only in css/dark-theme.css -->
<link rel="stylesheet" href="css/dark-theme.css?v=5.2.0">
</head>
<body>
<!-- NOSHI PAGE MAP: client-history.html
     CSS: css/client-history.css
     JS: js/client-history.js, js/client-history.part2.js
     Shared files remain shared. Do not change data keys during UI maintenance.
-->
  <div class="wrap">
    <div id="loading" class="fatal">⏳ جاري تحميل ملف العميل...</div>

    <main id="app" class="hide">
<!-- الهيدر فاضي (مساحة فارغة) -->
<header class="hero" style="padding-bottom: 10px;">
  <!-- ما فيه أزرار ولا شيء، بس اسم العميل -->
  <div class="title-box">
    <div class="avatar" id="avatar">ن</div>
    <h1 id="clientName">—</h1>
    <div class="sub" id="clientMeta">—</div>
    <div class="vip-pill" id="clientTier">⭐ تحليل العميل</div>
  </div>
</header>

<!-- المربع البرتقالي مع زر رجوع كبير (نازل تحت مع مسافة) -->
<div style="
  background: linear-gradient(135deg, #e67e22, #d35400);
  border-radius: 18px;
  padding: 18px 22px;
  margin: 20px 0 25px;
  box-shadow: 0 8px 30px rgba(211, 84, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
">
  <!-- النص -->
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 2rem; color: white;">📋</span>
    <span style="color: white; font-weight: 900; font-size: 1.2rem;">ملف العميل</span>
  </div>
  
  <!-- زر الرجوع -->
  <button onclick="location.href='client.html'" style="
    padding: 12px 28px;
    background: white;
    color: #d35400;
    border: none;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 900;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  "
  onmousedown="this.style.transform='scale(0.95)'"
  onmouseup="this.style.transform='scale(1)'"
  ontouchstart="this.style.transform='scale(0.95)'"
  ontouchend="this.style.transform='scale(1)'"
  >
    <span style="font-size: 1.4rem;">↩️</span>
    العودة للعملاء
  </button>
</div>

      <section class="section">
        <h2 class="section-title">📊 الإحصائية الشاملة</h2>
        <div id="statsGrid" class="grid stats-grid"></div>
      </section>

      <section class="section">
        <h2 class="section-title">🎯 مؤشرات ذكية</h2>
        <div id="circleGrid" class="grid circles"></div>
      </section>

      <section class="section">
        <h2 class="section-title">✨ لمحة سريعة</h2>
        <div id="smartGrid" class="grid smart-grid"></div>
      </section>

      <section class="section">
        <h2 class="section-title">🔥 منتجات العميل من الأكثر للأقل</h2>
        <div id="productsGrid" class="grid products-grid"></div>
      </section>

      <section class="section">
        <h2 class="section-title">📦 هيستوري الطلبات</h2>
        <div class="tools no-print">
          <input id="searchInput" type="text" placeholder="🔎 ابحث باسم منتج، مندوب، ملاحظة...">
          <select id="statusFilter">
            <option value="all">كل الحالات</option>
            <option value="paid">المدفوع فقط</option>
            <option value="unpaid">غير المدفوع فقط</option>
            <option value="cash">نقد فقط</option>
            <option value="transfer">تحويل فقط</option>
          </select>
          <select id="sortFilter">
            <option value="newest">الأحدث أولًا</option>
            <option value="highest">الأعلى قيمة</option>
            <option value="products">الأكثر منتجات</option>
            <option value="oldest">الأقدم أولًا</option>
          </select>
        </div>
        <div id="ordersList" class="orders"></div>
      </section>
    </main>

    <section id="picker" class="hide section">
      <h2 class="section-title">👥 اختر عميل لعرض ملفه</h2>
      <div id="clientPicker" class="client-picker"></div>
    </section>
  </div>
