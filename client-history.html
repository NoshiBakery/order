<html lang="ar" dir="rtl">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">

  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#fff8f0;--card:#fff;--ink:#263238;--muted:#697386;--brand:#e67e22;--brand2:#d35400;
      --cyan:#00bcd4;--green:#27ae60;--red:#e74c3c;--blue:#3498db;--purple:#8e44ad;--gold:#f1c40f;
      --shadow:0 12px 32px rgba(93,56,18,.14);--soft:0 5px 16px rgba(0,0,0,.08);--r:18px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;overflow-x:hidden} button,input,select{font-family:inherit} button{cursor:pointer} img{display:block;max-width:100%}
    .wrap{width:min(1150px,100%);margin:auto;padding:10px 10px 35px}.hero{position:relative;overflow:hidden;border-radius:0 0 30px 30px;padding:18px 14px 20px;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.5),transparent 26%),linear-gradient(135deg,#bf4b00,#e67e22 48%,#ffb066);color:#fff;box-shadow:var(--shadow)}
    .hero:before{content:"";position:absolute;inset:-70px -35px auto auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}.top-actions{display:flex;gap:8px;justify-content:space-between;align-items:center;position:relative;z-index:1}.btn{border:0;border-radius:14px;padding:10px 12px;font-weight:900;box-shadow:0 5px 12px rgba(0,0,0,.12)}.btn-light{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.35)}.btn-main{background:#fff;color:#bf4b00}.btn-green{background:var(--green);color:#fff}.btn-gray{background:#7f8c8d;color:#fff}.title-box{text-align:center;position:relative;z-index:1;margin-top:12px}.avatar{width:86px;height:86px;margin:0 auto 9px;border-radius:25px;background:linear-gradient(135deg,#fff,#ffe5c7);color:#d35400;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.16);border:3px solid rgba(255,255,255,.75)}h1{font-family:Tajawal,Cairo,sans-serif;font-size:1.65rem;margin:4px 0}.sub{opacity:.95;font-weight:700}.vip-pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.35);padding:7px 12px;border-radius:999px;font-weight:900}
    .section{margin:16px 0}.section-title{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:900;color:#d35400;margin:0 0 10px}.section-title:after{content:"";height:3px;background:linear-gradient(90deg,#e67e22,transparent);flex:1;border-radius:99px}.grid{display:grid;gap:10px}.stats-grid{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border-radius:var(--r);box-shadow:var(--soft);border:1px solid rgba(230,126,34,.10)}.stat{padding:13px;text-align:center;position:relative;overflow:hidden}.stat:before{content:"";position:absolute;top:0;right:0;width:100%;height:5px;background:var(--accent,var(--brand))}.stat .icon{font-size:1.3rem}.stat .label{font-size:.78rem;color:var(--muted);font-weight:800;margin-top:4px}.stat .value{font-size:1.15rem;font-weight:900;margin-top:3px;color:#222}.accent-green{--accent:var(--green)}.accent-blue{--accent:var(--blue)}.accent-red{--accent:var(--red)}.accent-purple{--accent:var(--purple)}.accent-gold{--accent:var(--gold)}.accent-cyan{--accent:var(--cyan)}
    .circles{grid-template-columns:repeat(3,1fr)}.circle-card{padding:14px;text-align:center}.ring{--p:0;--c:#e67e22;width:112px;height:112px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#eee 0);position:relative}.ring:after{content:"";position:absolute;inset:12px;background:white;border-radius:50%;box-shadow:inset 0 0 0 1px #f0f0f0}.ring strong{position:relative;z-index:1;font-size:1.25rem}.circle-label{margin-top:8px;font-weight:900}.smart-grid{grid-template-columns:repeat(4,1fr)}.smart{padding:12px}.smart b{display:block;color:#2d3436;margin-top:3px}.smart span{color:var(--muted);font-size:.82rem;font-weight:800}
    .tools{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px;margin:10px 0}.tools input,.tools select{width:100%;padding:11px;border:1px solid #ead7c4;border-radius:14px;background:#fff;font-weight:800;outline:none}.products-grid{grid-template-columns:repeat(2,1fr)}.product-card{display:grid;grid-template-columns:78px 1fr;gap:11px;padding:10px;align-items:center}.thumb{width:78px;height:78px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#fff3e0,#ffe0b2);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.no-image:before{content:"🍰";font-size:2rem}.rank{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:28px;border-radius:10px;background:#f5f5f5;font-weight:900;margin-left:5px}.rank.one{background:linear-gradient(135deg,#ffd700,#ffc107);color:#000}.rank.two{background:linear-gradient(135deg,#d6d6d6,#9e9e9e);color:white}.rank.three{background:linear-gradient(135deg,#cd7f32,#a0522d);color:white}.pname{font-weight:900}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.mini{background:#fff8f0;border-radius:10px;padding:6px;text-align:center}.mini small{display:block;color:#777;font-weight:800;font-size:.7rem}.mini b{font-size:.82rem}
    .orders{display:grid;gap:12px}.order{padding:12px;border-right:7px solid var(--brand);overflow:hidden}.order.paid{border-color:var(--green);background:linear-gradient(135deg,#fff,#effff6)}.order.unpaid{border-color:var(--red);background:linear-gradient(135deg,#fff,#fff0f0)}.order-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.order-num{font-weight:900;color:#d35400;background:#fff;padding:6px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;color:#fff;font-weight:900;font-size:.78rem;margin:4px 3px 0}.b-green{background:var(--green)}.b-red{background:var(--red)}.b-blue{background:var(--blue)}.b-gray{background:#7f8c8d}.b-purple{background:var(--purple)}.order-products{display:grid;gap:8px;margin-top:10px}.line{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.04);border-radius:14px;padding:7px}.line .thumb{width:56px;height:56px;border-radius:14px}.line-name{font-weight:900}.line-meta{color:#666;font-size:.78rem;font-weight:800}.line-total{font-weight:900;color:#2c3e50;white-space:nowrap}.order-total{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.total-box{background:#fff;border-radius:12px;padding:8px;text-align:center}.total-box small{display:block;color:#777;font-weight:800}.total-box b{font-size:.9rem}.note{margin-top:9px;background:#f7f7fb;border-right:4px solid var(--purple);border-radius:12px;padding:8px;color:#444;font-weight:700}.empty{padding:30px;text-align:center;color:#777;font-weight:900}.client-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.client-pick{padding:13px;text-align:right;border:0;border-radius:16px;background:#fff;box-shadow:var(--soft);font-weight:900}.client-pick span{display:block;color:#777;font-size:.8rem;margin-top:3px}.fatal{margin:20px auto;background:#fff;border-radius:18px;padding:18px;box-shadow:var(--soft);text-align:center;color:#c0392b;font-weight:900}.hide{display:none!important}
    @media(max-width:820px){.stats-grid{grid-template-columns:repeat(2,1fr)}.circles,.smart-grid,.products-grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.order-total{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:430px){.wrap{padding:0 8px 25px}.hero{border-radius:0 0 24px 24px}.stats-grid{grid-template-columns:1fr 1fr}.stat{padding:10px}.stat .value{font-size:.98rem}.product-card{grid-template-columns:66px 1fr}.thumb{width:66px;height:66px}.line{grid-template-columns:48px 1fr}.line-total{grid-column:2 / 3;text-align:right}.client-picker{grid-template-columns:1fr}}
  </style>
  <style id="noshi-auth-cloak">body{visibility:hidden!important}</style>
</head>
<body>
  <div class="wrap">
    <div id="loading" class="fatal">⏳ جاري تحميل ملف العميل...</div>

    <main id="app" class="hide">
<!-- الهيدر فاضي (مساحة فارغة) -->
<header class="hero" style="padding-bottom: 10px;">
  <!-- ما فيه أزرار ولا شيء، بس اسم العميل -->
  <div class="title-box">
    <div class="avatar" id="avatar">ن</div>
    <h1 id="clientName">—</h1>
    <div class="sub" id="clientMeta">—</div>
    <div class="vip-pill" id="clientTier">⭐ تحليل العميل</div>
  </div>
</header>

<!-- المربع البرتقالي مع زر رجوع كبير (نازل تحت مع مسافة) -->
<div style="
  background: linear-gradient(135deg, #e67e22, #d35400);
  border-radius: 18px;
  padding: 18px 22px;
  margin: 20px 0 25px;
  box-shadow: 0 8px 30px rgba(211, 84, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
">
  <!-- النص -->
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 2rem; color: white;">📋</span>
    <span style="color: white; font-weight: 900; font-size: 1.2rem;">ملف العميل</span>
  </div>
  
  <!-- زر الرجوع -->
  <button onclick="location.href='client.html'" style="
    padding: 12px 28px;
    background: white;
    color: #d35400;
    border: none;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 900;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  "
  onmousedown="this.style.transform='scale(0.95)'"
  onmouseup="this.style.transform='scale(1)'"
  ontouchstart="this.style.transform='scale(0.95)'"
  ontouchend="this.style.transform='scale(1)'"
  >
    <span style="font-size: 1.4rem;">↩️</span>
    العودة للعملاء
  </button>
</div>

      <section class="section">
        <h2 class="section-title">📊 الإحصائية الشاملة</h2>
        <div id="statsGrid" class="grid stats-grid"></div>
      </section>

      <section class="section">
        <h2 class="section-title">🎯 مؤشرات ذكية</h2>
        <div id="circleGrid" class="grid circles"></div>
      </section>

      <section class="section">
        <h2 class="section-title">✨ لمحة سريعة</h2>
        <div id="smartGrid" class="grid smart-grid"></div>
      </section>

      <section class="section">
        <h2 class="section-title">🔥 منتجات العميل من الأكثر للأقل</h2>
        <div id="productsGrid" class="grid products-grid"></div>
      </section>

      <section class="section">
        <h2 class="section-title">📦 هيستوري الطلبات</h2>
        <div class="tools no-print">
          <input id="searchInput" type="text" placeholder="🔎 ابحث باسم منتج، مندوب، ملاحظة...">
          <select id="statusFilter">
            <option value="all">كل الحالات</option>
            <option value="paid">المدفوع فقط</option>
            <option value="unpaid">غير المدفوع فقط</option>
            <option value="cash">نقد فقط</option>
            <option value="transfer">تحويل فقط</option>
          </select>
          <select id="sortFilter">
            <option value="newest">الأحدث أولًا</option>
            <option value="highest">الأعلى قيمة</option>
            <option value="products">الأكثر منتجات</option>
            <option value="oldest">الأقدم أولًا</option>
          </select>
        </div>
        <div id="ordersList" class="orders"></div>
      </section>
    </main>

    <section id="picker" class="hide section">
      <h2 class="section-title">👥 اختر عميل لعرض ملفه</h2>
      <div id="clientPicker" class="client-picker"></div>
    </section>
  </div>

  <script src="ui-modal.js"></script>
<script src="./db.js"></script>
  <script>
    const PRODUCT_IMAGES = {
      "كيكة ليمون":"images/lemon.png","كيكة سينابون":"images/cinnamon1.png","كيكة برتقال":"images/orange.png","كيكة رمل":"images/sand.jpg","كيكة كوكيز":"images/cookies.png","كيكة ماربل":"images/marble.png","كيكة دايجستف":"images/digestive.png","كيك دايجستف ميني":"images/digestive.png","كيكة تمر":"images/dates.png","قرص عقيلي":"images/aqeeli.png","كيكة شوكليت":"images/choco.jpg","ميني كيك ليمون":"images/minilemon.png","كيكة الكيري":"images/kiri.png","خلية قرفة":"images/honey1.png","خلية سمسم":"images/honey2.png","خلية سميد":"images/honey3.png","تاوة نوشي":"images/tawa.png","تاوة نوشي ميني":"images/tawamini.png","سينابون":"images/cinnabon.png","كرات الشعيرية":"images/shariya.png","فطيرة حلزونية":"images/spiral.png","تارت تفاح":"images/tart.png","تارت تشيز التمر":"images/tartdate.png","بوب كيك ليمون":"images/popcakelemon.png","بوب كيك شوكليت":"images/popcakechoco.png","بسبوسة":"images/basbousa.png","تشيز القشد":"images/chesedate.png","فطيرة المربى":"images/jam.png","وردات الشوكولاتة":"images/rose.png","تارت البيكان":"images/bekan.png","صحن تقديم":"images/plate.png","مندوب":"images/delivery.png","تكلفة إضافية":"images/extra.png"
    };
    let clients=[], salesData={}, currentClient=null, currentOrders=[];
    const $ = id => document.getElementById(id);
    const money = n => `${safe(n).toFixed(2)} ريال`;
    const safe = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
    const esc = v => String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    const params = new URLSearchParams(location.search);

    document.addEventListener("DOMContentLoaded", boot);

    async function readData(){
      let dbOk=false;
      try{
        if(window.NoshiDB){
          clients = await NoshiDB.get("clients", []);
          salesData = await NoshiDB.get("salesData", {});
          dbOk = true;
        }
      }catch(e){ console.warn("IndexedDB read failed", e); }
      if(!Array.isArray(clients)) clients = [];
      if(!salesData || typeof salesData !== "object" || Array.isArray(salesData)) salesData = {};
      return dbOk;
    }

    async function boot(){
      try{
        await readData();
        const id = params.get("id");
        currentClient = clients.find(c => String(c.id) === String(id));
        if(!currentClient){ showPicker(); return; }
        currentOrders = getClientOrders(currentClient);
        renderAll();
        $("loading").classList.add("hide");
        $("app").classList.remove("hide");
      }catch(e){
        console.error(e);
        $("loading").textContent = "❌ حدث خطأ أثناء تحميل بيانات العميل. افتح Console وأرسل الخطأ.";
      }
    }

    function showPicker(){
      $("loading").classList.add("hide");
      const box = $("clientPicker");
      if(!clients.length){ box.innerHTML = `<div class="fatal">لا توجد بيانات عملاء. استورد النسخة أولًا.</div>`; }
      else{
        box.innerHTML = clients.map(c => `<button class="client-pick" onclick="location.href='client-history-v2.html?id=${encodeURIComponent(c.id)}'">👤 ${esc(c.name)}<span>${esc(c.phone || 'بدون رقم')} • ${esc(c.date || 'بدون تاريخ')}</span></button>`).join("");
      }
      $("picker").classList.remove("hide");
    }

    function getAllOrders(){
      let arr=[];
      Object.values(salesData || {}).forEach(monthOrders => { if(Array.isArray(monthOrders)) arr = arr.concat(monthOrders); });
      return arr;
    }
    function getClientOrders(client){
      return getAllOrders().filter(o => String(o.clientId || "") === String(client.id || "") || (!o.clientId && o.client === client.name))
        .sort((a,b)=> new Date(b.date || 0) - new Date(a.date || 0));
    }
    function orderItems(order){ return Array.isArray(order.items) ? order.items : []; }
    function isDelivery(item){ return (item.originalName || item.name) === "مندوب"; }
    function itemBefore(item){ return safe(item.price) * safe(item.qty); }
    function itemAfter(item, order){
      let total = itemBefore(item);
      if(safe(item.discount)>0) total *= (1 - safe(item.discount)/100);
      const name = item.originalName || item.name;
      if(safe(order.generalDiscount)>0 && name !== "مندوب" && name !== "صحن تقديم") total *= (1 - safe(order.generalDiscount)/100);
      return total;
    }
    function orderBefore(order){ const calc=orderItems(order).reduce((s,i)=>s+itemBefore(i),0); return safe(order.totalBefore)||calc; }
    function orderAfter(order){ const calc=orderItems(order).reduce((s,i)=>s+itemAfter(i,order),0); return safe(order.totalAfter)||calc; }
    function orderQty(order){ return orderItems(order).filter(i=>!isDelivery(i)).reduce((s,i)=>s+safe(i.qty),0); }
    function deliveryTotal(order){ return orderItems(order).filter(isDelivery).reduce((s,i)=>s+itemBefore(i),0); }
function payment(order){
  // حالة تشيك بوكس السداد للكاش
  const cashPaid =
    order.paidByEmad === true ||
    order.checkboxStatus === true ||
    order.cashReceived === true;

  if(order.paymentMethod === "cash") {
    return {
      method: "نقد",
      methodClass: "b-purple",
      status: cashPaid ? "مدفوع" : "بانتظار الدفع",
      paid: cashPaid
    };
  }

  if(order.paymentMethod === "transfer") {
    return {
      method: "تحويل",
      methodClass: "b-blue",
      status: order.transferred ? "تم التحويل" : "بانتظار التحويل",
      paid: !!order.transferred
    };
  }

  return {
    method: "غير محدد",
    methodClass: "b-gray",
    status: "غير محدد",
    paid: false
  };
}
    function imgFor(name){ return PRODUCT_IMAGES[name] || PRODUCT_IMAGES[String(name||"").replace(/\s+\d+$/,'')] || "images/extra.png"; }
    function fmtDate(v){ return v ? String(v).replace("T"," ").slice(0,16) : "—"; }

    function renderAll(){
      const name = currentClient.name || "عميل";
      $("clientName").textContent = name;
      $("avatar").textContent = name.trim().slice(0,1) || "ع";
      $("clientMeta").textContent = `📞 ${currentClient.phone || 'بدون رقم'} • 📅 انضم: ${currentClient.date || 'غير محدد'}`;
      renderStats(); renderCircles(); renderSmart(); renderProducts(); renderOrders();
      ["searchInput","statusFilter","sortFilter"].forEach(id => $(id).addEventListener("input", renderOrders));
      $("statusFilter").addEventListener("change", renderOrders); $("sortFilter").addEventListener("change", renderOrders);
    }
    function computeStats(){
      const before=currentOrders.reduce((s,o)=>s+orderBefore(o),0), after=currentOrders.reduce((s,o)=>s+orderAfter(o),0), del=currentOrders.reduce((s,o)=>s+deliveryTotal(o),0);
      const paid=currentOrders.filter(o=>payment(o).paid).length;
      const qty=currentOrders.reduce((s,o)=>s+orderQty(o),0);
      const highest=Math.max(0,...currentOrders.map(orderAfter));
      const avg=currentOrders.length? after/currentOrders.length:0;
      return {orders:currentOrders.length,before,after,discount:Math.max(before-after,0),del,paid,unpaid:currentOrders.length-paid,qty,highest,avg,first:currentOrders.at(-1)?.date,last:currentOrders[0]?.date};
    }
    function tier(s){
      if(s.after >= 3000 || s.orders >= 25) return "👑 VIP ذهبي";
      if(s.after >= 1200 || s.orders >= 12) return "⭐ عميل مميز";
      if(s.orders >= 4) return "🌱 عميل واعد";
      return "🧁 عميل جديد";
    }
    function renderStats(){
      const s=computeStats(); $("clientTier").textContent = tier(s);
      const rows=[
        ["📦","عدد الطلبات",s.orders,"accent-purple"],["🧁","إجمالي المنتجات",s.qty,"accent-cyan"],["💰","قبل الخصم",money(s.before),""],["🏷️","إجمالي الخصم",money(s.discount),"accent-red"],["✅","الصافي",money(s.after),"accent-green"],["💎","أعلى فاتورة",money(s.highest),"accent-blue"],["📊","متوسط الطلب",money(s.avg),"accent-gold"],["🚚","مدفوع للمندوب",money(s.del),"accent-purple"],["🟢","طلبات مدفوعة",s.paid,"accent-green"],["🔴","طلبات معلقة",s.unpaid,"accent-red"],["🕒","أول طلب",fmtDate(s.first),"accent-blue"],["🆕","آخر طلب",fmtDate(s.last),"accent-cyan"]
      ];
      $("statsGrid").innerHTML = rows.map(r=>`<div class="card stat ${r[3]}"><div class="icon">${r[0]}</div><div class="label">${r[1]}</div><div class="value">${r[2]}</div></div>`).join("");
    }
    function productStats(){
      const map={};
      currentOrders.forEach(o=>orderItems(o).forEach(i=>{
        const name=i.originalName || i.name || "منتج"; if(isDelivery(i)) return;
        if(!map[name]) map[name]={name,qty:0,times:0,before:0,after:0};
        map[name].qty+=safe(i.qty); map[name].times+=1; map[name].before+=itemBefore(i); map[name].after+=itemAfter(i,o);
      }));
      return Object.values(map).sort((a,b)=>b.qty-a.qty || b.after-a.after);
    }
	
    function renderCircles(){
      const s=computeStats(), ps=productStats();
      const paidPct=s.orders?Math.round(s.paid/s.orders*100):0, discountPct=s.before?Math.round(s.discount/s.before*100):0, favPct=s.qty&&ps[0]?Math.round(ps[0].qty/s.qty*100):0;
      const data=[[paidPct,"#27ae60","نسبة السداد"],[discountPct,"#e74c3c","نسبة الخصم"],[favPct,"#8e44ad","سيطرة المنتج المفضل"]];
      $("circleGrid").innerHTML=data.map(d=>`<div class="card circle-card"><div class="ring" style="--p:${d[0]};--c:${d[1]}"><strong>${d[0]}%</strong></div><div class="circle-label">${d[2]}</div></div>`).join("");
    }
// أضف هذي الدالة
function getTopProductDisplay() {
  const allStats = productStats();
  if (!allStats || allStats.length === 0) return "—";
  
  const tray = allStats.find(p => p.name === "صحن تقديم");
  const topProduct = allStats[0];
  
  // إذا صحن التقديم هو الأول أو متساوي مع الأول
  if (tray && (tray === topProduct || (topProduct && tray.qty === topProduct.qty))) {
    const secondProduct = allStats.find(p => p.name !== "صحن تقديم");
    return secondProduct ? `صحن تقديم، ${secondProduct.name}` : "صحن تقديم";
  }
  
  return topProduct?.name || "—";
}

// وعدل هذي
function renderSmart(){
  const ps=productStats(), s=computeStats();
  const dayMap={}; 
  currentOrders.forEach(o=>{ 
    const d=new Date(o.date||""); 
    if(!isNaN(d)) dayMap[d.getDay()] = (dayMap[d.getDay()]||0)+1; 
  });
  const days=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const bestDay=Object.entries(dayMap).sort((a,b)=>b[1]-a[1])[0];
  const methods={}; 
  currentOrders.forEach(o=>{ 
    const m=payment(o).method; 
    methods[m]=(methods[m]||0)+1; 
  });
  const bestMethod=Object.entries(methods).sort((a,b)=>b[1]-a[1])[0]?.[0] || "—";
  const msg = s.unpaid>0 ? `لديه ${s.unpaid} طلب معلق` : s.orders?"كل الطلبات مسددة" : "لا توجد طلبات";
  
  // 🆕 استخدم الدالة الجديدة
  const topDisplay = getTopProductDisplay();
  
  const items=[
    ["🏆","المنتج الأكثر مبيعاً", topDisplay],
    ["📅","اليوم الأكثر طلبًا",bestDay?days[bestDay[0]]:"—"],
    ["💳","طريقة الدفع الغالبة",bestMethod],
    ["💡","اقتراح متابعة",msg]
  ];
  $("smartGrid").innerHTML=items.map(i=>`<div class="card smart"><span>${i[0]} ${i[1]}</span><b>${esc(i[2])}</b></div>`).join("");
}
    function renderProducts(){
      const ps=productStats();
      if(!ps.length){ $("productsGrid").innerHTML=`<div class="card empty">لا توجد منتجات لهذا العميل</div>`; return; }
      $("productsGrid").innerHTML=ps.map((p,i)=>{
        const r=i===0?'one':i===1?'two':i===2?'three':'';
        return `<div class="card product-card"><div class="thumb"><img src="${imgFor(p.name)}" alt="${esc(p.name)}" onerror="this.remove();this.parentElement.classList.add('no-image')"></div><div><div class="pname"><span class="rank ${r}">${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</span>${esc(p.name)}</div><div class="mini-stats"><div class="mini"><small>الكمية</small><b>${p.qty}</b></div><div class="mini"><small>مرات الطلب</small><b>${p.times}</b></div><div class="mini"><small>الصافي</small><b>${money(p.after)}</b></div></div></div></div>`;
      }).join("");
    }
    function renderOrders(){
      const q=($("searchInput")?.value||"").trim().toLowerCase(), status=$("statusFilter")?.value||"all", sort=$("sortFilter")?.value||"newest";
      let list=currentOrders.filter(o=>{
        const pay=payment(o);
        const statusOk=status==='all'||(status==='paid'&&pay.paid)||(status==='unpaid'&&!pay.paid)||(status==='cash'&&o.paymentMethod==='cash')||(status==='transfer'&&o.paymentMethod==='transfer');
        const text=[o.date,o.deliveryDate,o.deliveryPerson,o.mandoub,o.globalNote,...orderItems(o).map(i=>i.name)].join(' ').toLowerCase();
        return statusOk && (!q || text.includes(q));
      });
      list.sort((a,b)=> sort==='oldest'?new Date(a.date||0)-new Date(b.date||0):sort==='highest'?orderAfter(b)-orderAfter(a):sort==='products'?orderQty(b)-orderQty(a):new Date(b.date||0)-new Date(a.date||0));
      if(!list.length){ $("ordersList").innerHTML=`<div class="card empty">لا توجد طلبات مطابقة</div>`; return; }
      $("ordersList").innerHTML=list.map((o,i)=>orderCard(o,i)).join("");
    }
    function orderCard(o,i){
      const pay=payment(o), before=orderBefore(o), after=orderAfter(o), disc=Math.max(before-after,0), paidClass=pay.paid?'paid':'unpaid';
      const items=orderItems(o).map(it=>{
        const name=it.originalName||it.name||"منتج", qty=safe(it.qty), price=safe(it.price), total=itemAfter(it,o);
        return `<div class="line"><div class="thumb"><img src="${imgFor(name)}" alt="${esc(name)}" onerror="this.remove();this.parentElement.classList.add('no-image')"></div><div><div class="line-name">${esc(name)}</div><div class="line-meta">الكمية: ${qty} • السعر: ${money(price)}${safe(it.discount)?` • خصم المنتج: ${safe(it.discount)}%`:''}</div></div><div class="line-total">${money(total)}</div></div>`;
      }).join("");
      return `<article class="card order ${paidClass}"><div class="order-head"><div class="order-num">طلب #${i+1}</div><div style="font-weight:900;color:#555">${fmtDate(o.date)}</div></div><div><span class="badge ${pay.methodClass}">💳 ${pay.method}</span><span class="badge ${pay.paid?'b-green':'b-red'}">${pay.paid?'✅':'⏳'} ${pay.status}</span><span class="badge b-gray">🚚 ${esc(o.deliveryPerson||o.mandoub||'غير محدد')}</span>${o.deliveryDate?`<span class="badge b-blue">🕒 ${esc(o.deliveryDate)}</span>`:''}</div><div class="order-products">${items || '<div class="empty">لا توجد منتجات محفوظة</div>'}</div><div class="order-total"><div class="total-box"><small>قبل الخصم</small><b>${money(before)}</b></div><div class="total-box"><small>الخصم</small><b>${money(disc)}</b></div><div class="total-box"><small>الصافي</small><b>${money(after)}</b></div><div class="total-box"><small>المندوب</small><b>${money(deliveryTotal(o))}</b></div></div>${o.globalNote?`<div class="note">📝 ${esc(o.globalNote)}</div>`:''}</article>`;
    }
  </script>
