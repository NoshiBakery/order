<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبات الموقع - نوشي</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff8f0;color:#3b302c;font-family:Tahoma,Arial,sans-serif}body{padding:calc(10px + env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom))}.wrap{max-width:920px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.logo{width:58px;height:58px;object-fit:contain}.title{min-width:0;flex:1}.title h1{font-size:20px;margin:0}.title p{font-size:12px;color:#806c62;margin:4px 0 0}.iconbtn{min-width:46px;height:46px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 9px #0001;font-size:19px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar button{border:0;border-radius:12px;min-height:44px;padding:10px 14px;font-weight:800}.home{background:#00bcd4;color:#fff}.refresh{background:#fff;color:#5d4037;border:1px solid #eadbd0!important}.state{background:#fff;border:1px solid #eee2d8;border-radius:16px;padding:14px;margin-bottom:12px;font-size:13px}.state.cloud{background:#fff8e1;border-color:#ffe0a6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.card{background:#fff;border:1px solid #eee1d8;border-radius:17px;padding:14px;box-shadow:0 2px 8px #0000000d}.head{display:flex;justify-content:space-between;gap:8px;align-items:start}.orderno{font-weight:900;font-size:16px}.phone{direction:ltr;text-align:right;color:#5d4037;font-weight:700;margin-top:6px}.badge{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;white-space:nowrap}.known{background:#e7f6ed;color:#18763c}.new{background:#fff1df;color:#a65300}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.meta div{background:#fffaf6;border-radius:10px;padding:8px;font-size:12px}.meta b{display:block;font-size:13px;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1;min-width:95px;min-height:44px;border:0;border-radius:11px;font-weight:900}.details{background:#f2f0ee;color:#493b35}.accept{background:#2e9c57;color:#fff}.reject{background:#d94c46;color:#fff}.create{background:#e67e22;color:#fff}.empty{text-align:center;padding:34px 12px;color:#876f63}.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:50;padding-top:40px}.sheet.show{display:flex}.panel{width:min(100%,620px);max-height:88%;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 12px}.close{float:left;width:46px;height:46px;border:0;border-radius:14px;background:#ffe8e7;color:#c93e38;font-size:22px;font-weight:900}.detailrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f1e9e4;padding:9px 0;font-size:13px}.items{margin-top:10px}.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:9px 0;border-bottom:1px dashed #eadfd8;font-size:13px}.notes{background:#fff8ed;border-radius:11px;padding:10px;margin-top:10px;white-space:pre-wrap}.decision{display:flex;gap:8px;margin-top:14px}.decision button{flex:1;min-height:48px;border:0;border-radius:12px;font-weight:900;font-size:15px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input{width:100%;min-height:46px;border:1px solid #dfcdc1;border-radius:12px;padding:10px;font-size:16px}.msg{min-height:20px;font-size:13px;color:#b3261e;margin-top:8px}.total{font-size:18px;font-weight:900;text-align:left;margin-top:12px}.hidden{display:none!important}@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:24px;max-height:85%;margin-bottom:0}}
</style>
  <style id="noshi-auth-cloak">body{visibility:hidden!important}</style>
</head>
<body>
<main class="wrap">
  <div class="top"><img class="logo" src="Noshi.png" alt="Noshi"><div class="title"><h1>طلبات الموقع الخارجي</h1><p id="who">مراجعة الطلبات قبل إدخالها للنظام الداخلي</p></div><button class="iconbtn" id="logoutBtn" title="تسجيل الخروج">↪️</button></div>
  <div class="bar"><button class="home" id="homeBtn">🛍️ النظام الداخلي</button><button class="refresh" id="refreshBtn">↻ تحديث الطلبات</button></div>
  <div id="cloudState" class="state cloud hidden"></div>
  <div id="list" class="grid"><div class="state">جاري تجهيز لوحة الطلبات…</div></div>
</main>

<div id="detailsSheet" class="sheet" aria-hidden="true"><section class="panel" role="dialog" aria-modal="true"><button class="close" data-close="detailsSheet">×</button><h2>تفاصيل الطلب</h2><div id="detailsBody"></div></section></div>
<div id="clientSheet" class="sheet" aria-hidden="true"><section class="panel" role="dialog" aria-modal="true"><button class="close" data-close="clientSheet">×</button><h2>عميلة جديدة</h2><p>رقم الجوال غير موجود في قاعدة العملاء. اختر لها اسمًا ثم أنشئها قبل قبول الطلب.</p><div class="field"><label>رقم الجوال</label><input id="newPhone" readonly dir="ltr"></div><div class="field"><label>اسم العميلة</label><input id="newName" autocomplete="off" placeholder="مثال: أم محمد"></div><div class="field"><label>تاريخ الانضمام</label><input id="joinDate" type="date"></div><button id="createClientBtn" class="accept" style="width:100%;min-height:48px;border:0;border-radius:12px;font-weight:900">إنشاء العميلة</button><div id="clientMsg" class="msg"></div></section></div>

<script src="config.js"></script><script src="auth.js"></script><script src="db.js"></script><script src="incoming.js"></script><script src="ui-modal.js"></script>
<script>
(function(){
  'use strict';
  let orders=[], clients=[], selected=null;
  const list=document.getElementById('list'), cloudState=document.getElementById('cloudState');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>Number(n||0).toFixed(2)+' ر.س';
  const today=()=>new Date().toISOString().slice(0,10);
  function openSheet(id){const el=document.getElementById(id);el.classList.add('show');el.setAttribute('aria-hidden','false')}
  function closeSheet(id){const el=document.getElementById(id);el.classList.remove('show');el.setAttribute('aria-hidden','true')}
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeSheet(b.dataset.close)));
  document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)closeSheet(s.id)}));
  homeBtn.addEventListener('click',()=>location.href='index.html');
  logoutBtn.addEventListener('click',()=>NoshiAuth.logout());
  refreshBtn.addEventListener('click',load);

  async function getClients(){
    clients=await NoshiDB.get('clients',[]); if(!Array.isArray(clients)) clients=[];
  }
  function match(order){return NoshiIncoming.findClientByPhone(clients,order.phone)}
  function deliveryDT(o){return NoshiIncoming.combineDeliveryDate(o)||'غير محدد'}
  function render(){
    if(!orders.length){list.innerHTML='<div class="state empty">لا توجد طلبات جديدة تحتاج قرارًا حاليًا.</div>';return}
    list.innerHTML=orders.map(o=>{const c=match(o), p=NoshiIncoming.normalizeSaudiPhone(o.phone);return `<article class="card" data-id="${esc(o.id)}"><div class="head"><div><div class="orderno">طلب #${esc(o.orderNumber||o.id)}</div><div class="phone">${esc(p.valid?p.formatted:o.phone)}</div></div><span class="badge ${c?'known':'new'}">${c?'✓ '+esc(c.name):'عميلة جديدة'}</span></div><div class="meta"><div>التسليم<b>${esc(deliveryDT(o))}</b></div><div>التوصيل<b>${NoshiIncoming.deliveryAreaLabel(o.deliveryArea)} · ${NoshiIncoming.deliveryFee(o.deliveryArea)} ر.س</b></div></div><div class="actions"><button class="details" data-action="details">عرض الفاتورة</button>${c?'<button class="accept" data-action="accept">قبول</button>':'<button class="create" data-action="create">إنشاء العميلة</button>'}<button class="reject" data-action="reject">رفض</button></div></article>`}).join('');
  }
  list.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const card=b.closest('[data-id]');const o=orders.find(x=>String(x.id)===String(card.dataset.id));if(!o)return;selected=o; if(b.dataset.action==='details')showDetails(o); if(b.dataset.action==='create')showCreate(o); if(b.dataset.action==='accept')await acceptOrder(o); if(b.dataset.action==='reject')await rejectOrder(o)});

  function showDetails(o){
    const c=match(o), items=Array.isArray(o.items)?o.items:[], subtotal=items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||i.quantity||1),0), fee=NoshiIncoming.deliveryFee(o.deliveryArea), grand=Number(o.total||subtotal+fee);
    detailsBody.innerHTML=`<div class="detailrow"><span>رقم الطلب</span><b>#${esc(o.orderNumber||o.id)}</b></div><div class="detailrow"><span>رقم الجوال</span><b dir="ltr">${esc(NoshiIncoming.normalizeSaudiPhone(o.phone).formatted||o.phone)}</b></div><div class="detailrow"><span>العميلة</span><b>${c?esc(c.name):'عميلة جديدة'}</b></div><div class="detailrow"><span>موعد التسليم</span><b>${esc(deliveryDT(o))}</b></div><div class="detailrow"><span>التوصيل</span><b>${NoshiIncoming.deliveryAreaLabel(o.deliveryArea)} — ${fee} ر.س</b></div><div class="items">${items.map(i=>`<div class="item"><b>${esc(i.name||i.productName||'منتج')}</b><span>× ${esc(i.qty||i.quantity||1)}</span><span>${money(Number(i.price||0)*Number(i.qty||i.quantity||1))}</span>${i.notes?`<small style="grid-column:1/-1;color:#806c62">${esc(i.notes)}</small>`:''}</div>`).join('')}</div>${o.notes||o.note?`<div class="notes"><b>الملاحظات:</b><br>${esc(o.notes||o.note)}</div>`:''}<div class="total">الإجمالي: ${money(grand)}</div><div class="decision">${c?'<button class="accept" id="detailAccept">قبول</button>':'<button class="create" id="detailCreate">إنشاء العميلة أولًا</button>'}<button class="reject" id="detailReject">رفض</button></div>`;
    openSheet('detailsSheet');
    const a=document.getElementById('detailAccept'); if(a)a.onclick=()=>acceptOrder(o);
    const cr=document.getElementById('detailCreate'); if(cr)cr.onclick=()=>{closeSheet('detailsSheet');showCreate(o)};
    document.getElementById('detailReject').onclick=()=>rejectOrder(o);
  }
  function showCreate(o){const p=NoshiIncoming.normalizeSaudiPhone(o.phone);newPhone.value=p.formatted||o.phone;newName.value='';joinDate.value=today();clientMsg.textContent='';openSheet('clientSheet');setTimeout(()=>newName.focus(),80)}
  createClientBtn.addEventListener('click',async()=>{if(!selected)return;clientMsg.textContent='';try{const c=NoshiIncoming.makeClient(newName.value,selected.phone,joinDate.value);if(clients.some(x=>(x.name||'').trim()===c.name))throw new Error('هذا الاسم موجود مسبقًا');if(NoshiIncoming.findClientByPhone(clients,c.phone))throw new Error('هذا الرقم أصبح مرتبطًا بعميلة موجودة');clients.push(c);await NoshiDB.set('clients',clients);closeSheet('clientSheet');render();showDetails(selected)}catch(e){clientMsg.textContent=e.message}});

  async function acceptOrder(o){
    const c=match(o); if(!c){showCreate(o);return}
    const draft=NoshiIncoming.toInternalDraft(o,c);
    try{
      if(NoshiAuth.enabled()) await NoshiAuth.api(`/api/incoming-orders/${encodeURIComponent(o.id)}/accept`,{method:'POST',body:JSON.stringify({clientId:c.id})});
      await NoshiDB.set('incomingOrderDraft',draft);
      location.href='index.html?incoming='+encodeURIComponent(o.id);
    }catch(e){alert('تعذر قبول الطلب: '+(e.message||e))}
  }
  async function rejectOrder(o){
    const yes=await NoshiUI.confirm('هل تريد رفض الطلب #'+(o.orderNumber||o.id)+'؟',{title:'رفض الطلب',confirmText:'رفض',cancelText:'إلغاء'}); if(!yes)return;
    try{if(NoshiAuth.enabled()) await NoshiAuth.api(`/api/incoming-orders/${encodeURIComponent(o.id)}/reject`,{method:'POST'});orders=orders.filter(x=>String(x.id)!==String(o.id));closeSheet('detailsSheet');render()}catch(e){alert('تعذر رفض الطلب: '+(e.message||e))}
  }
  async function load(){
    list.innerHTML='<div class="state">جاري تحميل الطلبات…</div>'; await getClients();
    try{
      const me=await NoshiAuth.guard(); if(me&&me.displayName)who.textContent='مرحبًا '+me.displayName+' — راجع الطلب قبل القبول أو الرفض';
      if(!NoshiAuth.enabled()){
        cloudState.classList.remove('hidden');cloudState.textContent='الواجهة جاهزة. الطلبات الخارجية ستظهر هنا فور تفعيل Cloudflare في config.js وربط الـWorker.';orders=[];render();return;
      }
      cloudState.classList.add('hidden');const data=await NoshiAuth.api('/api/incoming-orders');orders=Array.isArray(data)?data:(data.orders||[]);render();
    }catch(e){list.innerHTML='<div class="state">تعذر تحميل الطلبات. '+esc(e.message||e)+'</div>'}
  }
  load();
})();
</script>
</body></html>
