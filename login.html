<!doctype html><html lang="ar" dir="rtl"><head>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تسجيل الدخول - نوشي</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));background:#fff7ef;color:#5d4037;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,390px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 16px 45px #6d4c4120;text-align:center}.logo{width:110px;height:110px;object-fit:contain}h1{font-size:22px;margin:8px 0 5px}.sub{font-size:13px;color:#8a7368;margin:0 0 20px}.field{text-align:right;margin:10px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;min-height:48px;padding:12px;border:1.5px solid #dfc7b7;border-radius:14px;font-size:16px;outline:none}input:focus{border-color:#a47148}button{width:100%;min-height:50px;padding:12px;margin-top:12px;border:0;border-radius:14px;background:#8d6e63;color:#fff;font-size:16px;font-weight:900}button:disabled{opacity:.6}.error{min-height:22px;color:#b3261e;font-size:14px;margin-top:10px}.note{font-size:12px;background:#fff8e1;border:1px solid #ffe0a6;border-radius:12px;padding:10px;margin-top:12px;text-align:right}</style></head><body><main class="card"><img class="logo" src="images/Noshi.webp" alt="Noshi"><h1>نظام نوشي الداخلي</h1><p class="sub">دخول خاص بالحسابات المصرح لها فقط</p><form id="loginForm"><div class="field"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submitBtn" type="submit">تسجيل الدخول</button><div id="error" class="error"></div><div id="cloudNote" class="note" hidden>صفحة الدخول جاهزة، وستعمل بعد تفعيل Cloudflare في config.js.</div></form></main><script src="config.js"></script><script src="auth.js"></script><script>const f=document.getElementById('loginForm'),err=document.getElementById('error'),btn=document.getElementById('submitBtn');if(!NoshiAuth.enabled()){cloudNote.hidden=false}f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';if(!NoshiAuth.enabled()){err.textContent='لم يتم تفعيل الاتصال السحابي بعد.';return}btn.disabled=true;try{await NoshiAuth.api('/api/auth/login',{method:'POST',body:JSON.stringify({username:username.value.trim(),password:password.value})});location.replace('dashboard.html')}catch(x){err.textContent=x.message==='TOO_MANY_ATTEMPTS'?'محاولات كثيرة. حاول لاحقًا.':'اسم المستخدم أو كلمة المرور غير صحيحة'}finally{btn.disabled=false}});</script></body></html>
