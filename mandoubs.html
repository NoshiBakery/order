<link rel="stylesheet" href="css/mandoubs.css?v=4.9.0">
  <style id="noshi-auth-cloak">
body{visibility:hidden!important}
html{background:#f6f1ec!important;min-height:100%;color-scheme:light}
html::before{content:"🔐  جاري التحقق من الجلسة…\A\Aانتظر لحظات";white-space:pre-line;visibility:visible!important;position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#f6f1ec;color:#3b302c;font:800 16px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
html[data-auth-state="slow"]::before{content:"⏳  التحقق أخذ وقتًا أطول من المعتاد…\A\Aلا تغلق التطبيق، نحاول إكمال الاتصال"}
html[data-auth-state="error"]::before{content:"⚠️  تعذر التحقق من الجلسة\A\Aاضغط على الشاشة لإعادة المحاولة";background:#fff5f2;color:#7a2e24}
html[data-theme="dark"]{background:#0f1418!important}
html[data-theme="dark"]::before{background:#0f1418;color:#f6f1eb}
html[data-theme="dark"][data-auth-state="error"]::before{background:#181214;color:#ffd8d3}
</style>
<script>
(function(){
  window.__noshiAuthSlowTimer=setTimeout(function(){
    if(document.getElementById('noshi-auth-cloak')) document.documentElement.dataset.authState='slow';
  },6000);
  window.__noshiAuthFailTimer=setTimeout(function(){
    if(!document.getElementById('noshi-auth-cloak')) return;
    document.documentElement.dataset.authState='error';
    document.documentElement.addEventListener('click',function(){ location.reload(); },{once:true});
  },18000);
})();
</script>

<link rel="stylesheet" href="css/theme.css?v=4.9.0">

<div class="container">
  <div class="logo">
    <img src="images/Noshi.webp" alt="Noshi Bakery Logo">
  </div>
  <h1>🚚 إدارة مستحقات المناديب</h1>
  
  <div class="tabs">
    <button class="tab-btn" onclick="location.href='index.html'">🛍️ المنتجات</button>
    <a class="tab-btn" href="dashboard.html" style="text-decoration:none; display:inline-block; box-sizing:border-box;">🌐 طلبات الموقع</a>
    <button class="tab-btn" onclick="location.href='order.html'">📦 الطلبات</button>
    <button class="tab-btn" onclick="location.href='client.html'">👥 العملاء</button>
    <button class="tab-btn" style="background:#00bcd4">🚚 المناديب</button>
	<button class="tab-btn" onclick="location.href='sales.html'">📊 الاحصائيات</button>
    <button class="tab-btn" onclick="location.href='expenses.html'">💳 المصروفات</button>
		<button class="tab-btn" onclick="window.location.href='client-products.html'">⏰ تسليم الطلبات</button>		
  </div>
  
  <!-- زر ضبط حجم الخط -->
  <div style="display:flex; justify-content:center; margin:10px 0;">
    <button class="font-size-btn" onclick="openFontSizeModal()">
      📝 ضبط حجم الخط
    </button>
  </div>
  
  <!-- تنقل الشهور -->
<div class="month-navigation">
  <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
    <button class="month-btn" id="prevMonth">▶ الشهر السابق</button>
    <div style="text-align:center"><div class="current-month" id="currentMonth"></div><div style="font-size:.72rem;color:#777;margin-top:2px;font-weight:700">حسب تاريخ التسليم</div></div>
    <button class="month-btn" id="nextMonth">الشهر التالي ◀</button>
  </div>
</div>
  
  <!-- جدول الطلبات -->
  <table class="orders-table">
    <thead>
      <tr>
        <th>#</th>
        <th>العميل</th>
        <th>المبلغ</th>
        <th>المندوب</th>
        <th>الحالة</th>
        <th>تفاصيل</th>
      </tr>
    </thead>
    <tbody id="ordersTableBody"></tbody>
  </table>
  
  <!-- إحصائيات المناديب -->
  <div class="mandoubs-stats">
    <h2 style="text-align:center; color:var(--secondary); margin-top:0;">إحصائيات المناديب</h2>
    <div id="mandoubsContainer"></div>
  </div>
</div>

<!-- مودال اختيار المندوب -->
<div id="mandoubModal" class="modal">
  <div class="modal-content">
    <h3 class="modal-title">اختر المندوب</h3>
    <button class="mandoub-option" onclick="selectMandoub('ماهر')">🚚 ماهر</button>
    <button class="mandoub-option" onclick="selectMandoub('اياد')">🚚 اياد</button>
    <button class="mandoub-option" onclick="selectMandoub('عماد')">🚚 عماد</button>
    <button class="mandoub-option" onclick="selectMandoub('عبد الملك')">🚚 عبد الملك</button>
    <button class="mandoub-option" onclick="selectMandoub('عبدالرحمن')">🚚 عبدالرحمن</button>
    <button class="mandoub-option" onclick="selectMandoub(null)">⚪ لم يتم تحديد المندوب</button>
    <button class="mandoub-option" style="background:#e74c3c" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<!-- نافذة تفاصيل الطلب (مودال محسن مع إيموجي) -->
<div id="orderDetailsModal" class="modal" style="align-items: center; justify-content: center;">
  <div class="modal-content" style="
    background: transparent;
    width: 94%;
    max-width: 380px;
    padding: 0;
    margin: 0;
    border-radius: 0;
    box-shadow: none;
  ">
    <div id="orderDetailsContent"></div>
  </div>
</div>

<!-- نافذة ضبط حجم الخط -->
<div id="fontSizeModal" class="modal">
  <div class="modal-content">
    <div class="font-size-modal-content">
      <span class="font-size-label">ضبط حجم خط الجداول</span>
      
      <div class="font-controls">
        <button class="font-btn decrease-btn" onclick="decreaseFontSize()">➖</button>
        
        <div class="font-size-display" id="currentFontSizeDisplay">16</div>
        
        <button class="font-btn increase-btn" onclick="increaseFontSize()">➕</button>
      </div>
      
      <div style="color: #7f8c8d; font-size: 0.9em; margin-bottom: 10px;">
        النطاق: 8 - 24 نقطة
      </div>
      
      <div class="preview-text" id="fontPreview">
        هذا مثال لنص المعاينة. سيكون حجم الخط في الجدول هكذا.
      </div>
      
      <button class="reset-btn" onclick="resetFontSize()">
        🔄 إعادة الضبط (16)
      </button>
      
      <button class="close-modal-btn" onclick="closeFontSizeModal()">
        إغلاق
      </button>
    </div>
  </div>
</div>

<script src="ui-modal.js?v=4.9.0"></script>

    overflow-y:auto;
    box-shadow:0 10px 35px rgba(0,0,0,0.18);

    text-align:center;
  ">

    <h3 style="
      color:#27ae60;
      margin:0 0 10px;
      font-size:19px;
      font-weight:800;
    ">
      💵 تأكيد السداد
    </h3>

    <div id="payMandoubInfo" style="margin-bottom:12px;"></div>

    <div style="display:flex; gap:8px;">
      <button id="cancelPayMandoub" style="
        flex:1;
        background:#e74c3c;
        color:#ffffff;
        border:none;
        padding:9px;

      ">

      </button>

      <button id="confirmPayMandoub" style="
        flex:1.25;
        background:#27ae60;
        color:#ffffff;
        border:none;
        padding:9px;
        min-height:40px;
        border-radius:10px;
        font-size:14px;
        font-weight:800;
        font-family:'Cairo',sans-serif;
        cursor:pointer;
      ">
        تأكيد السداد
      </button>
    </div>

  </div>
</div>

</div>
